[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcadiv"
version = "0.0.1"
description = "PCA-guided selection of diverse fictional context under a fixed token budget"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
encoders = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=2.6",
]
data = [
    "datasets>=2.18",
    "tiktoken>=0.6",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"